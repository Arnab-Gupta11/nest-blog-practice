version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: nestjs_postgres_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '123456'
      POSTGRES_DB: nestjs-blog
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
